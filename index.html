<script type="application/ld+json">

  "@context": "https://schema.org",
  "@type": "WebApplication",

  "description": "Besplatno vežbanje teorijskog ispita za A kategoriju: zvanična baza od 1327 pitanja, objašnjenja uz svaki odgovor, simulacija verna pravom ispitu.",
  "applicationCategory": "EducationalApplication",
  "operatingSystem": "Any",
  "inLanguage": "sr",

}

<title>Возачки А — вежбање</title>
<link rel="stylesheet" href="style.css?v=116">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#2c6aa0">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
<a class="preskoci" href="#glavni">Прескочи на садржај</a>
<div id="offlineStrip" hidden></div>
<header id="topbar">
  <div class="tbZona tbLevo"><button type="button" id="btnNazad" class="ghost" hidden>‹ <span id="btnNazadText"></span></button></div>
  <button type="button" class="brand" data-nav="home" title="Почетна">🏍️ <span id="brandTitle">Возачки А</span></button>
  <div class="tbZona tbDesno">
    <button id="btnTheme" class="ghost" aria-label="Tamna/svetla tema" title="Tamna/svetla tema">🌙</button>
    <button id="btnScript" class="ghost" aria-label="Promena pisma" title="Промени писмо">lat</button>
  </div>
</header>

<main id="glavni" tabindex="-1">
  <h1 class="samoZaCitace" id="naslovStrane">Возачки А — вежбаоница за теоријски испит, А категорија</h1>
  <!-- POČETNA -->
  <section id="view-home" class="view">
    <div class="card" id="homeSummary"></div>
    <!-- Meni ide preko cele širine (na širokom ekranu svih pet u jednom redu), pa se ispod
         dele dve kolone: levo napredak po oblastima, desno istorija i podešavanja.
         Ranije je sve stajalo levo pa je desna kolona zjapila prazna skoro 400px. -->
    <div class="menuGrid">
      <button class="menuBtn" data-nav="learn"><span class="mIcon">📖</span><span class="mTitle" id="mLearn"></span><span class="mSub" id="mLearnSub"></span></button>
      <button class="menuBtn" data-nav="drill"><span class="mIcon">🔁</span><span class="mTitle" id="mDrill"></span><span class="mSub" id="mDrillSub"></span></button>
      <button class="menuBtn" data-nav="marked"><span class="mIcon">🔖</span><span class="mTitle" id="mMarked"></span><span class="mSub" id="mMarkedSub"></span></button>
      <button class="menuBtn" data-nav="sim"><span class="mIcon">⏱️</span><span class="mTitle" id="mSim"></span><span class="mSub" id="mSimSub"></span></button>
      <button class="menuBtn" data-nav="stats"><span class="mIcon">📊</span><span class="mTitle" id="mStats"></span><span class="mSub" id="mStatsSub"></span></button>
    </div>
    <div class="card" id="simHistory"></div>
    <div class="card small" id="dataTools"></div>
    <div class="card" id="guideCard"></div>
    <div class="card" id="pojmovnikCard"></div>
    <div class="card" id="faqCard"></div>
    <div class="card" id="trustCard"></div>
  </section>

  <!-- UČENJE / DRILL / MARKED (zajednički prikaz pitanja) -->
  <section id="view-question" class="view">
    <div id="qProgress" class="qProgress"></div>
    <div class="card" id="qCard"></div>
  </section>

  <!-- SIMULACIJA -->
  <section id="view-sim" class="view">
    <div class="simTop card">
      <div id="simTimer" class="simTimer">45:00</div>
      <div style="flex:1"></div>
      <button id="btnSimReport" class="secondary"></button>
      <button id="btnFinishSim" class="primary"></button>
    </div>
    <div class="card" id="simQCard"></div>
    <div class="card" id="simReport" style="display:none"></div>
  </section>

  <!-- REZULTAT SIMULACIJE -->
  <section id="view-simresult" class="view">
    <div class="card" id="simResultCard"></div>
    <div id="simWrongList"></div>
  </section>

  <!-- OBLAST / PODOBLAST -->
  <section id="view-browse" class="view">
    <div class="card" id="browseHead"></div>
    <div class="card" id="browseList"></div>
  </section>

  <!-- STATISTIKA -->
  <section id="view-stats" class="view">
    <div class="card" id="readyCard"></div>
    <div class="card" id="statsCard"></div>
  </section>
</main>

<nav id="donjaNav" aria-label="Главна навигација">
  <button type="button" data-nav="home"><span class="dnIkona">🏠</span><span class="dnTekst" id="dnHome"></span></button>
  <button type="button" data-nav="learn"><span class="dnIkona">📖</span><span class="dnTekst" id="dnLearn"></span></button>
  <button type="button" data-nav="drill"><span class="dnIkona">🔁</span><span class="dnTekst" id="dnDrill"></span></button>
  <button type="button" data-nav="sim"><span class="dnIkona">⏱️</span><span class="dnTekst" id="dnSim"></span></button>
  <button type="button" data-nav="stats"><span class="dnIkona">📊</span><span class="dnTekst" id="dnStats"></span></button>
</nav>

<footer id="podnozje"></footer>

</body>
</html>
